name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The daily relock dispatches it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  check:
    uses: bats-lang/repository-prototype/.github/workflows/package-check.yml@3f6d8367f909cc69c5ef8a620c43d36bd2486648 # repository-prototype claude/393-package-check 3f6d836
